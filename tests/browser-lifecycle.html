<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game-shell{position:fixed;inset:0;width:100%;height:100%}#game{width:100%;height:100%}#fullscreen-button{position:absolute;right:12px;bottom:12px;width:52px;height:52px;z-index:5}#fullscreen-button[hidden]{display:none}</style></head>
<body><div id="game-shell"><div id="game"></div><button id="fullscreen-button" hidden></button></div><div id="rotate-message" hidden>ROTATE</div><p id="result" data-status="ready">READY</p>
<script type="module">
import Phaser from 'phaser';
import {PLAYER_ART_KEY} from '/src/character-visual.js';
import { MenuScene, ArenaScene } from '/src/scenes.js';
import { setupViewport } from '/src/viewport.js';
import { toggleFullscreen } from '/src/fullscreen.js';
const game = new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:800,height:360,scale:{mode:Phaser.Scale.RESIZE},physics:{default:'arcade'},input:{activePointers:3},scene:[MenuScene,ArenaScene]});
window.__game=game;
setupViewport(game);
document.getElementById('fullscreen-button').addEventListener('click', () => toggleFullscreen(document.getElementById('game-shell'), () => game.scale.refresh()));
window.__identity=null;
window.__trace=[];
window.__visualSession=()=>{const a=game.scene.getScene('Arena');return {player:a.player,shadow:a.playerVisual?.shadow,sprite:a.playerVisual?.sprite};};
window.__sessionHistory=[];
window.__captureVisualSession=()=>{const v=window.__visualSession();window.__sessionHistory.push(v);return window.__sessionHistory.length;};
window.__sessionIntegrity=()=>{const a=game.scene.getScene('Arena'),now=window.__visualSession();return {current:{shadowActive:!!now.shadow?.active,spriteActive:!!now.sprite?.active,shadowMatches:now.shadow===a.playerVisual?.shadow,bodyRadius:a.player?.body?.radius},past:window.__sessionHistory.map(v=>({playerSame:v.player===now.player,shadowSame:v.shadow===now.shadow,spriteSame:v.sprite===now.sprite,shadowActive:!!v.shadow?.active,spriteActive:!!v.sprite?.active}))};};

window.__snapshot=() => {
  const arena=game.scene.getScene('Arena');
  const menu=game.scene.getScene('Menu');
  if(!arena?.sys||!menu?.sys)return null;
  const canvas=game.canvas.getBoundingClientRect();
  const actions=menu.sys.isActive()?menu.input._list.filter(o=>o.input&&o.width>150).map(o=>({x:o.x,y:o.y,width:o.width,height:o.height,label:menu.children.list.find(t=>t.type==='Text'&&['NOWA GRA','WZNÓW'].includes(t.text)&&Math.abs(t.y-o.y)<1)?.text})):[];
  const hud=arena.sys.isActive()?arena.input._list.find(o=>o.input&&o.width===185):null;
  return {
    menu:game.scene.isActive('Menu'),arena:game.scene.isActive('Arena'),arenaPaused:game.scene.isPaused('Arena'),
    actions,
    menuButton:hud?{x:hud.x,y:hud.y,width:hud.width,height:hud.height}:null,
    button:actions[0]??null,
    rect:{x:canvas.x,y:canvas.y,width:canvas.width,height:canvas.height},
    gameBox:(()=>{const r=document.getElementById('game').getBoundingClientRect();return {width:r.width,height:r.height};})(),
    scale:{width:game.scale.width,height:game.scale.height},
    player:arena.player?{x:arena.player.x,y:arena.player.y}:null,
    playerId:arena.player===window.__identity?.player,
    physics:arena.physics?.world?.isPaused??null,
    playerVisual:arena.playerVisual?{loaded:arena.playerVisual.loaded,physicsVisible:arena.player.visible,visualScale:arena.playerVisual.sprite?.scaleX??null,shadowCount:arena.children.list.filter(o=>o.type==='Ellipse'&&o.depth===10).length,shadowX:arena.playerVisual.shadow?.x??null,shadowY:arena.playerVisual.shadow?.y??null,shadowAngle:arena.playerVisual.shadow?.rotation??null,shadowDepth:arena.playerVisual.shadow?.depth??null,shadowAlpha:arena.playerVisual.shadow?.fillAlpha??null,visualX:arena.playerVisual.sprite?.x??null,visualY:arena.playerVisual.sprite?.y??null,frame:arena.playerVisual.sprite?.frame?.name??null,rotation:arena.playerVisual.sprite?.rotation??null,filter:arena.playerVisual.sprite?.texture?.source?.[0]?.scaleMode??null,textureFrames:game.textures.exists(PLAYER_ART_KEY)?Array.from({length:8},(_,i)=>game.textures.get(PLAYER_ART_KEY).has(String(i))):[],markerDepth:arena.player.depth,visualDepth:arena.playerVisual.sprite?.depth??null,bodyRadius:arena.player.body?.radius??null,followIdentity:arena.cameras?.main?._follow===arena.player}:null,
    camera:arena.cameras?.main?.id??null,
    fullscreenHidden:document.getElementById('fullscreen-button').hidden,
    fullscreenActive:Boolean(document.fullscreenElement),
    fullscreenSupported:document.fullscreenEnabled,
    fullscreenRect:(()=>{const r=document.getElementById('fullscreen-button').getBoundingClientRect();return {x:r.x+r.width/2,y:r.y+r.height/2};})(),
    fullscreenVisible:getComputedStyle(document.getElementById('fullscreen-button')).display!=='none',
    focused:document.hasFocus(),hidden:document.hidden,portrait:innerHeight>innerWidth,
    sceneStatus:{menu:menu.sys.settings.status,arena:arena.sys.settings.status},
    sceneOrder:game.scene.scenes.map(scene=>scene.sys.settings.key),
    controls:arena.joystick&&arena.aimJoystick?{
      left:{x:arena.joystick.direction.x,y:arena.joystick.direction.y,id:arena.joystick.pointerId,nativeId:arena.joystick.touchIdentifier},
      right:{x:arena.aimJoystick.direction.x,y:arena.aimJoystick.direction.y,id:arena.aimJoystick.pointerId,nativeId:arena.aimJoystick.touchIdentifier},
      mouseHeld:arena.mouseHeld,lastFacing:arena.lastFacing,
      shots:arena.projectiles.length,shotAt:arena.lastShotAt,
      targetCount:arena.targets.length,
      layoutIndex:arena.layoutIndex,
      obstacles:arena.obstacles.map(o=>({type:o.type,x:o.x,y:o.y,hp:o.hp,alive:o.alive,visualActive:o.sprite.active,depth:o.sprite.depth})),
      groundActive:arena.ground?.active,groundDepth:arena.ground?.depth,groundType:arena.ground?.type,groundWidth:arena.ground?.width,groundHeight:arena.ground?.height,groundTileX:arena.ground?.tilePositionX??null,groundTileY:arena.ground?.tilePositionY??null,groundGridActive:arena.groundGrid?.active??false,groundTextureWidth:game.textures.get('klusoczlek-arena-ground')?.source?.[0]?.width??null,groundTextureHeight:game.textures.get('klusoczlek-arena-ground')?.source?.[0]?.height??null,worldWidth:arena.physics?.world?.bounds?.width,worldHeight:arena.physics?.world?.bounds?.height,
      blockerBodyCount:arena.sys.isActive()?arena.obstacleBodies?.getChildren().filter(o=>o.active).length:null,
      hp:arena.playerHp,defeated:arena.defeated,
      enemies:arena.enemies.map(e=>({x:e.x,y:e.y,hp:e.hp})),
    }:null,
    menuOverArena:game.scene.scenes.indexOf(menu)>game.scene.scenes.indexOf(arena),
    trace:window.__trace.slice(-20),
    samePlayer:!window.__identity||arena.player===window.__identity.player,
    sameCamera:!window.__identity||arena.cameras?.main===window.__identity.camera,
  };
};
window.__traceEvents=()=>{for(const key of ['Menu','Arena']){const scene=game.scene.getScene(key);for(const name of ['start','pause','resume','shutdown','sleep','wake'])scene.events.on(name,()=>window.__trace.push({scene:key,event:name,menu:game.scene.isActive('Menu'),arena:game.scene.isActive('Arena'),arenaPaused:game.scene.isPaused('Arena')}));}return true;};
window.__movePlayer=()=>{const arena=game.scene.getScene('Arena');window.__identity={player:arena.player,camera:arena.cameras.main};arena.player.setPosition(552,440);arena.cameras.main.centerOn(552,440);};
</script></body></html>

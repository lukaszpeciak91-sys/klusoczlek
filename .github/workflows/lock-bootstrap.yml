name: Bootstrap npm lockfile (temporary)
on:
  push:
    branches: [feat/pr01-web-foundation]
    paths: ['.github/workflows/lock-bootstrap.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr01-web-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to existing PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "PR01 audit: reproducible npm lockfile"
          git push origin HEAD:feat/pr01-web-foundation
